server:
  port: 8080
  servlet:
    context-path: /HIS
    session:
      timeout: 30m

spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB
  datasource:
    url: jdbc:mysql://localhost:3306/his?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: Gg20041213
    driver-class-name: com.mysql.cj.jdbc.Driver
  cache:
    type: redis    # 有缓存; 改成 none 即关闭缓存，用于性能对比测试
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password: ${REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: his-ai-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.hospitalinfo.hospitalinformationsystem.entity
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

# JWT配置
jwt:
  secret: ${JWT_SECRET:HisSecretKeyForJwtToken2024MustBeAtLeast256BitsLongForHS256}
  # Token有效期（秒）：24小时
  expiration: ${JWT_EXPIRATION:86400}
  # 刷新Token有效期（秒）：7天
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800}
  # 请求头名称
  header: Authorization
  # Token前缀
  token-prefix: "Bearer "

# Kafka配置
kafka:
  enabled: true  # 设置为true启用Kafka，false则跳过Kafka初始化
  topics:
    # AI任务消息队列
    ai-task: his-ai-task
    # 预约通知消息队列
    appointment-notify: his-appointment-notify

# LangChain4j + Qwen AI Configuration
ai:
  qwen:
    api-key: ${DASH_SCOPE_API_KEY:YOUR_QWEN_API_KEY}
    model-name: qwen-plus
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    embedding:
      api-key: ${DASH_SCOPE_API_KEY:YOUR_QWEN_API_KEY}
      model-name: text-embedding-v2
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1

# 文件上传配置
file:
  upload-dir: ${user.dir}/uploads
  avatar-max-size: 5242880  # 5MB

logging:
  level:
    com.hospitalinfo.hospitalinformationsystem: debug
    org.springframework.cache: debug
    org.springframework.kafka: info