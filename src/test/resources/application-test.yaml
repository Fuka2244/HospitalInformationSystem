server:
  port: 8081
  servlet:
    context-path: /HIS
    session:
      timeout: 30m

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/his_test?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      database: 1

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.hospitalinfo.hospitalinformationsystem.entity
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

# 测试环境AI配置 - 使用假的API Key，测试中mock ChatLanguageModel
ai:
  qwen:
    api-key: test-api-key
    model-name: qwen-plus
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  embedding:
    model-name: text-embedding-v2
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
